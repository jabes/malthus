<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ball in a circle</title>
    <style>
        :root {
            --ink: #10161c;
            --paper: #dfe3e0;
            --line: #6f7d82;
            --ball: #e2603a;
            --trace: #4a8c8c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 20px;
            background: var(--ink);
            color: var(--paper);
            font: 400 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        canvas {
            width: min(90vw, 800px);
            height: auto;
            aspect-ratio: 1;
            touch-action: none;
        }
    </style>
</head>
<body>
<canvas id="c" width="1120" height="1120"></canvas>
<script src="script.js"></script>
</body>
</html>
